name: Agent 2 — Generate IPO blog from DRHP

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: blog-generate-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  generate:
    # only on DRHP issues, only for /generate comments, only from the repo owner
    if: >
      github.event.issue.pull_request == null &&
      startsWith(github.event.comment.body, '/generate') &&
      contains(toJSON(github.event.issue.labels.*.name), 'drhp') &&
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest

    steps:
      - name: Acknowledge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --body "🤖 Generating draft… [watch the run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # --no-save stops every run from rewriting package.json as npm
      # re-resolves the tree. Nothing here needs recording: the runner is
      # thrown away.
      - name: Install dependencies
        run: |
          if [ ! -f package.json ]; then npm init -y; fi
          npm install --no-save cheerio pdfjs-dist@4.0.379

      - name: Generate page
        id: gen
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Backup providers. Without these lines the script sees no key and
          # skips them, which is why a Gemini billing error ended the run.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/generate_blog.js

      # A run once reported success, pushed a branch, and threw the article
      # away: create-pull-request found nothing staged, deleted its own branch
      # and exited clean. This step makes the working tree visible in the log
      # BEFORE the PR step, so that can never be a mystery again.
      - name: Show what changed
        run: |
          echo "=== Script outputs ==="
          echo "slug:       '${{ steps.gen.outputs.slug }}'"
          echo "company:    '${{ steps.gen.outputs.company }}'"
          echo "file:       '${{ steps.gen.outputs.file }}'"
          echo "unverified: '${{ steps.gen.outputs.unverified }}'"
          echo
          echo "=== git status (whole tree) ==="
          git status --porcelain
          echo
          echo "=== git status limited to the paths the PR step will stage ==="
          git status --porcelain -- ipo data/ipo_aliases.json
          echo
          if [ -z "$(git status --porcelain -- ipo data/ipo_aliases.json)" ]; then
            echo "::error::The script reported success but nothing changed under ipo/ or data/ipo_aliases.json."
            echo "::error::Nothing would be committed, so no pull request can be opened."
            exit 1
          fi
          echo "Changes present. Proceeding to open a pull request."

      # add-paths entries are git pathspecs. 'ipo' as a bare directory is
      # unambiguous; 'ipo/**' relies on glob behaviour that differs depending
      # on whether pathspec magic is in play, and is the likeliest reason a
      # run staged nothing.
      - name: Open pull request
        id: pr
        uses: peter-evans/create-pull-request@v6
        with:
          branch: drhp/${{ steps.gen.outputs.slug }}
          delete-branch: true
          commit-message: "content: ${{ steps.gen.outputs.company }} IPO page from DRHP"
          title: "📝 ${{ steps.gen.outputs.company }} — IPO page from DRHP"
          body-path: pr_body.md
          labels: drhp-draft
          add-paths: |
            ipo
            data/ipo_aliases.json

      # create-pull-request exits successfully when it has nothing to open a
      # PR for. Without this, a thrown-away article looks exactly like a
      # successful run.
      - name: Fail if no pull request was opened
        if: steps.pr.outputs.pull-request-number == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::error::The draft was generated but no pull request was opened."
          gh issue comment ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --body "⚠️ The draft generated successfully but **no pull request was opened**, so the article was discarded. This usually means nothing was staged for the commit. [See the log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) — the \`Show what changed\` step lists the working tree. Re-comment \`/generate <ranges>\` once the cause is fixed."
          exit 1

      - name: Link the PR on the issue
        if: steps.pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --body "✅ Draft ready: #${{ steps.pr.outputs.pull-request-number }} — ${{ steps.gen.outputs.unverified }} figure(s) flagged for verification. Review and merge to publish."

      - name: Report failure on the issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --body "❌ Generation failed — nothing was written. [See the log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). Common causes: wrong page ranges, a scanned PDF with no text layer, every AI provider refusing (check the log for billing or quota errors), or the model returning invalid JSON. Re-comment \`/generate <ranges>\` to retry."
