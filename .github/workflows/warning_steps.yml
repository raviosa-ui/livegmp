# ============================================================
# Pipeline warnings -> Telegram
#
# Replace the existing "Build GMP data + page" step in
# .github/workflows/update_gmp.yml with the THREE steps below.
# Everything else in that workflow stays as it is.
#
# Why here and not in build_gmp.js: the script already prints every warning
# it raises. Grepping its output needs no change to the pipeline itself, so
# there is nothing new that can break the hourly build.
#
# Deduplication matters: the same warning would otherwise be sent every hour
# for days. The hash of the warning text is stored in
# data/pipeline_warn_hash.txt and a message is sent only when it CHANGES.
# ============================================================

      - name: Build GMP data + page
        id: build
        run: |
          set -o pipefail
          node scripts/build_gmp.js 2>&1 | tee build.log

      - name: Collect pipeline warnings
        id: warn
        if: always()
        run: |
          # Lines worth waking someone for. Deliberately NOT every console line:
          #   POSSIBLE DUPLICATE  - a second page about to be created for one company
          #   TYPE MISMATCH       - Mainboard/SME labelling contradicts NSE
          #   WARNING:            - unknown types, missing LIVE zone, source oddities
          grep -E "POSSIBLE DUPLICATE|TYPE MISMATCH|WARNING:|no usable type|not merged automatically|would create ipo/" build.log > warnings.txt || true
          # keep the copy-pasteable alias suggestions that follow those lines
          grep -E '^\s+"[^"]+": "[a-z0-9-]+",?$' build.log >> warnings.txt || true

          if [ -s warnings.txt ]; then
            COUNT=$(wc -l < warnings.txt)
            HASH=$(sha1sum warnings.txt | cut -c1-16)
            PREV=$(cat data/pipeline_warn_hash.txt 2>/dev/null || echo "none")
            echo "count=$COUNT"  >> $GITHUB_OUTPUT
            echo "hash=$HASH"    >> $GITHUB_OUTPUT
            echo "changed=$([ "$HASH" = "$PREV" ] && echo false || echo true)" >> $GITHUB_OUTPUT
            echo "--- warnings ---"; cat warnings.txt
          else
            echo "count=0" >> $GITHUB_OUTPUT
            echo "changed=false" >> $GITHUB_OUTPUT
            rm -f data/pipeline_warn_hash.txt      # clean slate once resolved
            echo "No pipeline warnings."
          fi

      - name: Telegram — pipeline warnings
        if: steps.warn.outputs.changed == 'true'
        continue-on-error: true
        run: |
          mkdir -p data
          echo "${{ steps.warn.outputs.hash }}" > data/pipeline_warn_hash.txt
          # Telegram caps a message at 4096 chars; 12 lines is plenty to act on.
          BODY=$(head -12 warnings.txt)
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=⚠️ LiveGMP pipeline — ${{ steps.warn.outputs.count }} warning(s)

$BODY

Log: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --data-urlencode "disable_web_page_preview=true"
