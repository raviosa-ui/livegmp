name: Update GMP (scrape -> gmp.json -> index.html)

on:
  schedule:
    - cron: '30 * * * *'   # hourly at :30
  workflow_dispatch:

jobs:
  build-gmp:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install cheerio
        run: |
          if [ ! -f package.json ]; then npm init -y; fi
          npm install cheerio

      - name: Build GMP data + page
        run: node scripts/build_gmp.js

      - name: Commit changes (only if data changed)
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update GMP data"
          file_pattern: "gmp.json index.html sitemap.xml ipo/index.html ipo/*/index.html data/ipo_types.json data/page_lastmod.json"
          branch: main

      # A push made with GITHUB_TOKEN does NOT trigger other workflows, so
      # deploy.yml never fired after these commits. Deploy directly instead.
      - name: Stage site files
        if: steps.commit.outputs.changes_detected == 'true'
        run: |
          rm -rf deploy && mkdir deploy
          rsync -a \
            --exclude ".git" --exclude ".github" --exclude "deploy" \
            --exclude "scripts" --exclude "node_modules" --exclude "data" \
            --exclude "package.json" --exclude "package-lock.json" \
            --exclude ".htaccess" --exclude "health_report.md" --exclude "watchdog_report.md" \
            ./ deploy/
          echo "Deploying $(find deploy -type f | wc -l) files"

      - name: Publish to Cloudflare Pages
        if: steps.commit.outputs.changes_detected == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy deploy --project-name=livegmp --branch=main

      - name: Notify on failure (Telegram)
        if: failure()
        continue-on-error: true
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="🔴 LiveGMP: GMP build or deploy failed. Check the Actions log: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
