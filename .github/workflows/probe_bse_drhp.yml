name: Probe — BSE SME DRHP page

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe BSE SME DRHP
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36'
          JAR=/tmp/c.txt
          curl -s -o /dev/null -c $JAR -A "$UA" --max-time 20 https://www.bseindia.com/ || true

          probe () {
            echo "--- $1 ---"
            CODE=$(curl -s -o /tmp/o -w '%{http_code}' -L --max-time 30 -A "$UA" -b $JAR -c $JAR \
              -H 'Accept: text/html,application/xhtml+xml,*/*;q=0.8' \
              -H 'Accept-Language: en-US,en;q=0.9' \
              ${3:+-H "Referer: $3"} "$2" 2>/dev/null || echo 000)
            SIZE=$(wc -c < /tmp/o 2>/dev/null || echo 0)
            DRHP=$(grep -oci 'drhp\|draft' /tmp/o 2>/dev/null | head -1)
            LTD=$(grep -oci 'limited' /tmp/o 2>/dev/null | head -1)
            PDF=$(grep -oci '\.pdf' /tmp/o 2>/dev/null | head -1)
            echo "code=$CODE bytes=$SIZE draft=$DRHP ltd=$LTD pdfs=$PDF"
            echo "first 300 chars:"; head -c 300 /tmp/o; echo ""
          }

          probe "bsesme SMEIPODRHP"  "https://www.bsesme.com/PublicIssues/SMEIPODRHP.aspx"
          probe "bseindia same path" "https://www.bseindia.com/PublicIssues/SMEIPODRHP.aspx" "https://www.bseindia.com/"
          probe "bseindia markets path" "https://www.bseindia.com/markets/PublicIssues/SMEIPODRHP.aspx" "https://www.bseindia.com/"
          probe "bsesme root retry"  "https://www.bsesme.com/"

          echo "=== DNS check ==="
          getent hosts www.bsesme.com || echo "bsesme.com does NOT resolve from this runner"
          getent hosts www.bseindia.com || echo "bseindia.com does not resolve"
