name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    # Pushes that only touch ipo/ are deployed by update_gmp.yml after it has
    # rebuilt the sitemap and indexes. Deploying here too would race it and
    # could publish the old sitemap last. Any push that also changes other
    # files still deploys here as before.
    paths-ignore:
      - 'ipo/**'
      - 'data/**'     # never deployed; an article merge also edits data/ipo_aliases.json
      - 'docs/**'     # never deployed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stage site files
        run: |
          rm -rf deploy && mkdir deploy
          rsync -av \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "deploy" \
            --exclude "scripts" \
            --exclude "node_modules" \
            --exclude "package.json" \
            --exclude "package-lock.json" \
            --exclude ".htaccess" \
            --exclude "health_report.md" \
            --exclude "data" \
            --exclude "docs" \
            --exclude "watchdog_report.md" \
            --exclude "build.log" --exclude "warnings.txt" \
            ./ deploy/
          echo "Deploying $(find deploy -type f | wc -l) files"

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy deploy --project-name=livegmp --branch=main
